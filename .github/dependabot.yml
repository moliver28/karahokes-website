version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # eslint-config-next does not support eslint 10 yet (rule loading
      # TypeError in the react plugin); drop the ignore when it does.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript-eslint does not support TS 7 yet; drop the ignore
      # when it does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
